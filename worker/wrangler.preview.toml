# Must never match the production Worker name in wrangler.production.toml: a
# preview deploy under that name would replace the live shaxda.app script.
name = "shaxda-worker-preview"
main = "src/index.ts"
compatibility_date = "2026-07-05"
workers_dev = true

[observability]
enabled = true

[vars]
RATED_PLAY_ENABLED = "false"
ALLOWED_ORIGIN = "https://shaxda-web-preview.shaxda.workers.dev"

[[durable_objects.bindings]]
name = "MATCH_ROOM"
class_name = "MatchRoom"

[[durable_objects.bindings]]
name = "MATCH_COORDINATOR"
class_name = "RoomCoordinator"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MatchRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["RoomCoordinator"]

[[d1_databases]]
binding = "DB"
database_name = "shaxda-db-preview"
database_id = "5a84ac83-8387-4b68-b831-28ec450cd922"
migrations_dir = "../packages/db/migrations"
migrations_table = "d1_migrations"

[[ratelimits]]
name = "MATCH_OPS_RATE_LIMIT"
namespace_id = "1002"
simple = { limit = 20, period = 60 }
