name = "shaxda-worker"
main = "src/index.ts"
compatibility_date = "2026-07-05"
workers_dev = false

[observability]
enabled = true

[vars]
RATED_PLAY_ENABLED = "false"
ALLOWED_ORIGIN = "https://shaxda.app"

[[routes]]
pattern = "shaxda.app/rooms*"
zone_name = "shaxda.app"

[[routes]]
pattern = "shaxda.app/health"
zone_name = "shaxda.app"

[[routes]]
pattern = "shaxda.app/ops/*"
zone_name = "shaxda.app"

[[durable_objects.bindings]]
name = "MATCH_ROOM"
class_name = "MatchRoom"

[[durable_objects.bindings]]
name = "MATCH_COORDINATOR"
class_name = "RoomCoordinator"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MatchRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["RoomCoordinator"]

[[d1_databases]]
binding = "DB"
database_name = "shaxda-db"
database_id = "b84cc232-ddbd-437d-acd0-0fa0d77e12b0"
migrations_dir = "../packages/db/migrations"
migrations_table = "d1_migrations"

[[ratelimits]]
name = "MATCH_OPS_RATE_LIMIT"
namespace_id = "1002"
simple = { limit = 20, period = 60 }
