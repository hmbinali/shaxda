name = "shaxda-worker"
main = "src/index.ts"
compatibility_date = "2026-07-05"

[observability]
enabled = true

# Dev/test only. Preview and production use Wrangler secrets instead.
[vars]
ONLINE_IDENTITY_SECRET = "shaxda-online-identity-dev-test-secret-000000000001"

[[durable_objects.bindings]]
name = "MATCH_ROOM"
class_name = "MatchRoom"

[[durable_objects.bindings]]
name = "MATCH_COORDINATOR"
class_name = "RoomCoordinator"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MatchRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["RoomCoordinator"]
